# 模式 train:训练 predict:预测
mode=train
# cuda cpu apple
coreType=apple

# 推理
boardSize=20
numGames=100
numSimulation=200
explorationFactor=3

# 训练
numProcesses=1
lr = 5e-5
wd = 1e-4
batchSize = 256
episode = 99999
randomRate=0.9
useVct=false
trainEpochs = 2
replayBufferSize = 300000
# 新通道梯度放大系数（仅作用于 conv1.weight 的 ch4/ch5 维度）
# 6ch 改造后 ch4/ch5 起点为 0，激活速度慢，放大梯度等效更大 lr，加速激活
# 1.0 = 不放大；建议 5-10；ch4/ch5 量级追上 ch3 后改回 1.0
newChannelLrMult = 10.0
# n-step TD bootstrapping 参数
tdN = 5
tdGamma = 0.7
# Gumbel MCTS（自对弈用）
gumbelSimulations = 32
gumbelTopK = 16

# VCT 离线标注（训练前对 record/*.txt 做必胜判定，将 value 覆盖为 +1.0）
vctLabelEnabled = true
vctLabelMaxTimeMs = 5000
vctLabelProcesses = 8
vctLabelRecordDir = record

# 文件路径
; cppPath=../out/build/x64-Release/ego-zero.exe
cppPath=../cmake-build-torch/run.sh
# Evaluate uses ONNX backend (for checkpoint compatibility)
cppPathEval=../cmake-build-debug/ego-gomoku-zero
modelPath=./model/model_latest.onnx

# Elo 评估
evalInterval = 1000
evalGames = 40
evalSimulation = 100
# 连续 N 次 Elo 下降触发回滚到最后一次正 Elo 的 checkpoint
eloRollbackThreshold = 6

# Arena 门槛准入
arenaInterval = 500
arenaGames = 40
arenaSimulation = 100
arenaWinRateThreshold = 0.53
arenaMaxSkip = 10