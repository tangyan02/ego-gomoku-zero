# 模式 train:训练 predict:预测
mode=train
# cuda cpu apple
coreType=apple

# 推理
boardSize=20
numGames=100
numSimulation=200
explorationFactor=3

# 训练
numProcesses=1
lr = 5e-4
wd = 1e-4
batchSize = 256
episode = 99999
randomRate=0.9
useVct=false
trainEpochs = 2
valueWeight = 1.0
replayBufferSize = 300000
# 自对弈温度采样：前 N 步 T=1 按 visit 分布采样，N 步后 T=0 贪心
# 0 = 全程贪心；测试 2ch 网络在 bug 修复后是否能自主形成攻势
temperatureSteps = 0
# 丢弃平局对局：value target 全 0，对 value head 无监督信号
skipDrawGames = true
# 文件路径
; cppPath=../out/build/x64-Release/ego-zero.exe
cppPath=../cmake-build-torch/run.sh
# Evaluate uses ONNX backend (for checkpoint compatibility)
cppPathEval=../cmake-build-debug/ego-gomoku-zero
modelPath=./model/model_latest.onnx

# Elo 评估
evalInterval = 1000
evalGames = 40
evalSimulation = 100
# Elo 自动回退（默认关闭；2026-05-31 改默认 false，由人工判断+手动回滚）
eloRollbackEnabled = false
# 连续 N 次 Elo 下降触发回滚到最后一次正 Elo 的 checkpoint（仅 eloRollbackEnabled=true 时生效）
eloRollbackThreshold = 4

